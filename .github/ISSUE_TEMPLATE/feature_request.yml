name: Feature request
description: Suggest a capability for codewalk
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to understand?
      description: Describe the situation, not the solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would help
    validations:
      required: true

  - type: textarea
    id: mental-model
    attributes:
      label: How would this improve Mental Model Efficiency?
      description: |
        codewalk optimises for how completely and accurately a human understands
        a change per unit of attention. Features that add information without
        adding understanding usually make it worse.

  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This does not turn codewalk into a code review tool
