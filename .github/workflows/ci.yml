name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          check-latest: true

      # The test suite builds fixture git repositories, so git must be
      # configured enough to commit.
      - name: Configure git for fixtures
        run: |
          git config --global user.name "codewalk ci"
          git config --global user.email "ci@example.com"
          git config --global init.defaultBranch main

      - name: Check formatting
        run: make fmt-check

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        run: make build

      # No API keys in CI: model behaviour is covered by the evaluation system,
      # which is run deliberately rather than on every pull request.
      - name: Help output
        run: ./bin/codewalk --help
